<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lesson Plans Index</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">

  <!-- Shared base font-size (see type-scale.css) - keeps this page's rem-
       based sizing (h1, badges, section headers, ...) consistent with the
       lesson and printable pages it links to, instead of hand-copying its
       own number. -->
  <link rel="stylesheet" href="type-scale.css">

  <style>
    :root {
      --primary: #1e3a8a;
      --primary-light: #2563eb;
      --accent: #d97706;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --border: #94a3b8;
      --success: #15803d;
      --success-bg: #dcfce7;
      --guide: #7c2d12;
      --guide-bg: #fff7ed;
      --empty: #64748b;
      --empty-bg: #f1f5f9;
    }
    * { box-sizing: border-box; }
    body, input, button {
      font-family: 'Montserrat', sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      line-height: 1.6;
    }
    .app-container {
      max-width: 1200px;
      margin: 0 auto;
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.12);
      border: 4px solid var(--primary);
      overflow: hidden;
    }
    header {
      background: var(--primary);
      color: white;
      padding: 28px 32px;
      text-align: center;
    }
    .brand-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      margin-bottom: 16px;
    }
    .brand-logo { height: 110px; width: auto; display: block; }
    .brand-name {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: inherit;
      opacity: 0.95;
    }
    .badge {
      display: inline-block;
      background: #f59e0b;
      color: #000;
      padding: 6px 18px;
      border-radius: 30px;
      font-size: 0.95rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    h1 { margin: 8px 0; font-size: 2.2rem; font-weight: 800; }
    p.subtitle { margin: 4px 0 0 0; font-size: 1.05rem; opacity: 0.95; }

    .content { padding: 28px 32px 36px 32px; }

    /* ===== Grade (class) section ===== */
    .grade-section {
      margin-bottom: 30px;
      border: 2px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }
    .grade-header {
      background: var(--primary-light);
      color: white;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .grade-header h2 { margin: 0; font-size: 1.5rem; font-weight: 800; }
    .grade-header span.subject-tag {
      background: rgba(255,255,255,0.18);
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .grade-body { padding: 16px 20px; }

    /* ===== Reference links row (syllabus / refresher) ===== */
    .ref-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }
    .ref-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      background: #eef2ff;
      border: 2px solid #6366f1;
      color: #3730a3;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 700;
    }
    .ref-link:hover { background: #e0e7ff; }

    /* ===== Topic card: outer wrapper for the 6-button page grid ===== */
    .topic-card {
      border: 2px solid var(--border);
      border-radius: 12px;
      margin-bottom: 18px;
      overflow: hidden;
      background: var(--bg);
    }
    .topic-card:last-child { margin-bottom: 0; }
    .topic-card-header {
      background: #dbeafe;
      color: var(--primary);
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .topic-card-header .topic-title {
      font-weight: 800;
      font-size: 1.05rem;
    }
    .topic-card-header .topic-standard {
      font-weight: 700;
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: #1d4ed8;
      opacity: 0.8;
    }
    .topic-card-body {
      padding: 14px 16px 16px 16px;
    }
    p.topic-sub { margin: 0 0 14px 0; color: #475569; font-size: 0.92rem; }

    /* ===== Page-link button grid (6 buttons per topic) ===== */
    .item-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
    }
    .day-btn, .guide-btn, .empty-tag {
      display: block;
      text-decoration: none;
      border-radius: 10px;
      padding: 12px 12px;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    .day-btn { background: var(--success-bg); border: 2px solid var(--success); color: var(--text); }
    .guide-btn { background: var(--guide-bg); border: 2px solid var(--guide); color: var(--guide); }
    .day-btn:hover, .guide-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 14px rgba(0,0,0,0.12); }

    .item-label {
      display: block;
      font-weight: 800;
      text-transform: uppercase;
      font-size: 0.76rem;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .day-btn .item-label { color: var(--success); }
    .guide-btn .item-label { color: var(--guide); }
    .item-topic {
      display: block;
      font-size: 0.88rem;
      font-weight: 600;
      line-height: 1.3;
    }

    /* Tag shown for a page slot with no content yet */
    .empty-tag {
      background: var(--empty-bg);
      border: 2px dashed var(--border);
      color: var(--empty);
      cursor: default;
    }
    .empty-tag .item-label { color: var(--empty); }
    .empty-tag .item-topic { font-style: italic; }

    footer {
      text-align: center;
      padding: 18px;
      color: #94a3b8;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

<div class="app-container">
  <header>
    <div class="brand-row">
      <img src="assets/lia-logo.png" alt="Lincoln International Academy logo" class="brand-logo">
      <span class="brand-name">Lincoln International Academy</span>
    </div>
    <span class="badge">2026-2027 Academic Year</span>
    <h1>Lesson Plans</h1>
    <p class="subtitle">Digital lessons, guided practice, and teacher guides &mdash; organized by grade and topic</p>
  </header>

  <div class="content" id="content"></div>

  <footer>Lincoln International Academy &middot; Lesson Plans Index</footer>
</div>

<script>
  /*
   * CURRICULUM is the single source of truth for this index.
   *
   * Structure: Grade → topics[] → pages{}
   *
   * Each topic exposes up to six named pages:
   *   vocabulary   – key terms, definitions, and real examples
   *   explanation  – direct instruction (concepts + worked examples)
   *   guided       – guided practice with word problems
   *   exercises    – error analysis, IXL, cross-disciplinary exercises
   *   enrichment   – real-world jigsaw / extension activity
   *   assessment   – graded classwork
   *   guide        – teacher guide (answer keys, printables, challenge bank)
   *
   * To publish a new topic: add one entry to the grade's `topics` array.
   * Omit a page key (or leave its href blank) to render a "No content yet"
   * placeholder instead of a broken link.
   */

  const PAGE_ORDER = [
    { key: "vocabulary",  label: "Vocabulary",  kind: "day" },
    { key: "explanation", label: "Explanation", kind: "day" },
    { key: "guided",      label: "Guided",      kind: "day" },
    { key: "exercises",   label: "Exercises",   kind: "day" },
    { key: "enrichment",  label: "Enrichment",  kind: "day" },
    { key: "assessment",  label: "Assessment",  kind: "day" },
    { key: "guide",       label: "Teacher Guide", kind: "guide" }
  ];

  const CURRICULUM = {
    Sixth: {
      label: "Sixth Grade",
      subject: "Math 6",
      syllabus: "Sixth/syllabus.html",
      refresher: "Sixth/refresher.html",
      topics: [
        {
          id: "decimal-operations",
          title: "Decimal Operations",
          standard: "6.NS.B.3",
          summary: "Add, subtract, and multiply decimals; multi-step word problems; error analysis; real-world jigsaw; graded classwork.",
          pages: {
            vocabulary:  { href: "Sixth/Topics/decimal-operations/vocabulary.html",           topic: "Key Terms &amp; Place Value" },
            explanation: { href: "Sixth/Topics/decimal-operations/explanation.html",          topic: "Add, Subtract &amp; Multiply Decimals" },
            guided:      { href: "Sixth/Topics/decimal-operations/practice/guided.html",      topic: "Multi-Step Word Problems" },
            exercises:   { href: "Sixth/Topics/decimal-operations/practice/exercises.html",   topic: "Error Analysis &amp; Health Science" },
            enrichment:  { href: "Sixth/Topics/decimal-operations/practice/enrichment.html",  topic: "Real-World Decimal Jigsaw" },
            assessment:  { href: "Sixth/Topics/decimal-operations/practice/assessment.html",  topic: "Graded Classwork" },
            guide:       { href: "Sixth/Topics/decimal-operations/teacher-guide.html" }
          }
        }
      ]
    },
    Seventh: {
      label: "Seventh Grade",
      subject: "Pre-Algebra",
      syllabus: "Seventh/syllabus.html",
      refresher: "Seventh/refresher.html",
      topics: [
        {
          id: "integers-and-operations",
          title: "Integers &amp; Operations",
          standard: "7.NS.A.1–2",
          summary: "Lessons 1.1–1.4: opposites &amp; absolute value, add/subtract/multiply/divide integers, official Savvas Quick Check, graded classwork.",
          pages: {
            vocabulary:  { href: "Seventh/Topics/integers-and-operations/vocabulary.html",           topic: "Key Terms &amp; Integer Properties" },
            explanation: { href: "Seventh/Topics/integers-and-operations/explanation.html",          topic: "Integers, Opposites &amp; Operations" },
            guided:      { href: "Seventh/Topics/integers-and-operations/practice/guided.html",      topic: "Multiply &amp; Divide Integers" },
            exercises:   { href: "Seventh/Topics/integers-and-operations/practice/exercises.html",   topic: "Quick Check 1.1–1.4" },
            enrichment:  { href: "Seventh/Topics/integers-and-operations/practice/enrichment.html",  topic: "Skill Reinforcement" },
            assessment:  { href: "Seventh/Topics/integers-and-operations/practice/assessment.html",  topic: "Graded Classwork" },
            guide:       { href: "Seventh/Topics/integers-and-operations/teacher-guide.html" }
          }
        }
      ]
    },
    Eighth: {
      label: "Eighth Grade",
      subject: "Algebra I",
      syllabus: "Eighth/syllabus.html",
      refresher: "Eighth/refresher.html",
      topics: [
        {
          id: "solving-linear-equations",
          title: "Solving Linear Equations",
          standard: "HSA.CED.A.1, HSA.REI.A.1, HSA.REI.B.3",
          summary: "Lessons 1-2 &amp; 1-3: variables on one and both sides, classifying solutions, real-world applications, graded classwork.",
          pages: {
            vocabulary:  { href: "Eighth/Topics/solving-linear-equations/vocabulary.html",           topic: "Key Terms &amp; Properties of Equality" },
            explanation: { href: "Eighth/Topics/solving-linear-equations/explanation.html",          topic: "Solving Linear Equations" },
            guided:      { href: "Eighth/Topics/solving-linear-equations/practice/guided.html",      topic: "Practice: Solving Linear Equations" },
            exercises:   { href: "Eighth/Topics/solving-linear-equations/practice/exercises.html",   topic: "One, None, or Infinitely Many Solutions?" },
            enrichment:  { href: "Eighth/Topics/solving-linear-equations/practice/enrichment.html",  topic: "Review: Solving Linear Equations" },
            assessment:  { href: "Eighth/Topics/solving-linear-equations/practice/assessment.html",  topic: "Graded Classwork" },
            guide:       { href: "Eighth/Topics/solving-linear-equations/teacher-guide.html" }
          }
        }
      ]
    }
  };

  const GRADE_ORDER = ["Sixth", "Seventh", "Eighth"];

  function renderPageBtn(pageEntry, label, kind) {
    if (!pageEntry || !pageEntry.href) {
      return `
        <span class="empty-tag">
          <span class="item-label">${label}</span>
          <span class="item-topic">No content yet</span>
        </span>`;
    }
    const cls = kind === "guide" ? "guide-btn" : "day-btn";
    return `
      <a class="${cls}" href="${pageEntry.href}">
        <span class="item-label">${label}</span>
        <span class="item-topic">${pageEntry.topic || "Teacher Guide"}</span>
      </a>`;
  }

  function renderTopic(topic) {
    const buttons = PAGE_ORDER.map(({ key, label, kind }) =>
      renderPageBtn(topic.pages[key], label, kind)
    ).join("");
    return `
      <div class="topic-card">
        <div class="topic-card-header">
          <span class="topic-title">${topic.title}</span>
          <span class="topic-standard">${topic.standard}</span>
        </div>
        <div class="topic-card-body">
          <p class="topic-sub">${topic.summary || ""}</p>
          <div class="item-row">
            ${buttons}
          </div>
        </div>
      </div>`;
  }

  function renderRefRow(grade) {
    const links = [];
    if (grade.syllabus)  links.push(`<a class="ref-link" href="${grade.syllabus}">Course Syllabus</a>`);
    if (grade.refresher) links.push(`<a class="ref-link" href="${grade.refresher}">Diagnostic Refresher</a>`);
    return links.length ? `<div class="ref-row">${links.join("")}</div>` : "";
  }

  function renderGrade(gradeKey) {
    const grade = CURRICULUM[gradeKey];
    const topicsHtml = (grade.topics || []).map(renderTopic).join("") ||
      `<p style="color:var(--empty); font-style:italic; padding:16px;">No topics published yet.</p>`;
    return `
      <div class="grade-section">
        <div class="grade-header">
          <h2>${grade.label}</h2>
          <span class="subject-tag">${grade.subject}</span>
        </div>
        <div class="grade-body">${renderRefRow(grade)}${topicsHtml}</div>
      </div>`;
  }

  document.getElementById("content").innerHTML = GRADE_ORDER.map(renderGrade).join("");
</script>

</body>
</html>
