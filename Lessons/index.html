<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lesson Plans Index</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">

  <!-- Shared base font-size (see type-scale.css) - keeps this page's rem-
       based sizing (h1, badges, section headers, ...) consistent with the
       lesson and printable pages it links to, instead of hand-copying its
       own number. -->
  <link rel="stylesheet" href="type-scale.css">

  <style>
    :root {
      --primary: #1e3a8a;
      --primary-light: #2563eb;
      --accent: #d97706;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --border: #94a3b8;
      --empty: #64748b;
      --empty-bg: #f1f5f9;

      /* One accent color per section, reused for its chip on every
         topic card so the same section always reads the same color
         no matter which grade or topic it belongs to. */
      --c-vocab: #0f766e;      --c-vocab-bg: #ccfbf1;
      --c-explain: #1d4ed8;    --c-explain-bg: #dbeafe;
      --c-practice: #15803d;   --c-practice-bg: #dcfce7;
      --c-word: #7c3aed;       --c-word-bg: #ede9fe;
      --c-test: #b91c1c;       --c-test-bg: #fee2e2;
      --c-teacher: #92400e;    --c-teacher-bg: #fef3c7;
    }
    * { box-sizing: border-box; }
    body, input, button {
      font-family: 'Montserrat', sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      line-height: 1.6;
    }
    .app-container {
      max-width: 1200px;
      margin: 0 auto;
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.12);
      border: 4px solid var(--primary);
      overflow: hidden;
    }
    header {
      background: var(--primary);
      color: white;
      padding: 28px 32px;
      text-align: center;
    }
    .brand-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      margin-bottom: 16px;
    }
    .brand-logo { height: 110px; width: auto; display: block; }
    .brand-name {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: inherit;
      opacity: 0.95;
    }
    .badge {
      display: inline-block;
      background: #f59e0b;
      color: #000;
      padding: 6px 18px;
      border-radius: 30px;
      font-size: 0.95rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    h1 { margin: 8px 0; font-size: 2.2rem; font-weight: 800; }
    p.subtitle { margin: 4px 0 0 0; font-size: 1.05rem; opacity: 0.95; }

    .content { padding: 28px 32px 36px 32px; }

    /* ===== Grade picker (pill tabs, one per grade) ===== */
    .grade-picker {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-bottom: 28px;
    }
    .grade-pill {
      border: 2px solid var(--primary-light);
      background: var(--card);
      color: var(--primary);
      padding: 12px 26px;
      border-radius: 40px;
      font-weight: 800;
      font-size: 1.02rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .grade-pill:hover { background: #dbeafe; }
    .grade-pill.active {
      background: var(--primary);
      color: white;
      box-shadow: 0 6px 14px rgba(30,58,138,0.35);
    }
    .grade-pill .pill-subject {
      display: block;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      opacity: 0.75;
      margin-top: 2px;
    }

    /* ===== Grade panel ===== */
    .grade-panel { display: none; }
    .grade-panel.active { display: block; }

    .grade-intro {
      text-align: center;
      margin-bottom: 22px;
    }
    .grade-intro h2 { margin: 0 0 4px 0; font-size: 1.6rem; color: var(--primary); font-weight: 800; }
    .grade-intro p { margin: 0; color: #475569; font-size: 0.98rem; }

    /* ===== Topic cards ===== */
    .topic-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
    }
    .topic-card {
      border: 2px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      background: var(--bg);
      display: flex;
      flex-direction: column;
    }
    .topic-card-head {
      background: var(--primary-light);
      color: white;
      padding: 18px 20px;
    }
    .topic-card-head h3 { margin: 0 0 6px 0; font-size: 1.25rem; font-weight: 800; }
    .topic-card-head p { margin: 0; font-size: 0.9rem; opacity: 0.95; }
    .topic-card-body { padding: 16px 18px 18px 18px; }
    .section-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
    }
    .section-link {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      border-radius: 10px;
      padding: 11px 12px;
      font-weight: 700;
      font-size: 0.88rem;
      border: 2px solid transparent;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    .section-link:hover { transform: translateY(-2px); box-shadow: 0 6px 14px rgba(0,0,0,0.12); }
    .section-link.vocab    { background: var(--c-vocab-bg);    color: var(--c-vocab);    border-color: var(--c-vocab); }
    .section-link.explain  { background: var(--c-explain-bg);  color: var(--c-explain);  border-color: var(--c-explain); }
    .section-link.practice { background: var(--c-practice-bg); color: var(--c-practice); border-color: var(--c-practice); }
    .section-link.word     { background: var(--c-word-bg);     color: var(--c-word);     border-color: var(--c-word); }
    .section-link.test     { background: var(--c-test-bg);     color: var(--c-test);     border-color: var(--c-test); }
    .section-link.teacher  { background: var(--c-teacher-bg);  color: var(--c-teacher);  border-color: var(--c-teacher); }

    .empty-tag {
      display: block;
      background: var(--empty-bg);
      border: 2px dashed var(--border);
      color: var(--empty);
      border-radius: 10px;
      padding: 11px 12px;
      font-weight: 700;
      font-size: 0.88rem;
      font-style: italic;
      cursor: default;
    }

    .coming-soon {
      color: var(--empty);
      font-style: italic;
      font-size: 1rem;
      text-align: center;
      padding: 40px 20px;
      border: 2px dashed var(--border);
      border-radius: 14px;
    }

    footer {
      text-align: center;
      padding: 18px;
      color: #94a3b8;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

<div class="app-container">
  <header>
    <div class="brand-row">
      <img src="assets/lia-logo.png" alt="Lincoln International Academy logo" class="brand-logo">
      <span class="brand-name">Lincoln International Academy</span>
    </div>
    <span class="badge">2026-2027 Academic Year</span>
    <h1>Lesson Plans</h1>
    <p class="subtitle">Digital lessons organized by topic - vocabulary, explanation, practice, word problems, test prep, and teacher guides</p>
  </header>

  <div class="content">
    <div class="grade-picker" id="grade-picker"></div>
    <div id="grade-panels"></div>
  </div>

  <footer>Lincoln International Academy &middot; Lesson Plans Index</footer>
</div>

<script>
  /*
   * CURRICULUM is the single source of truth for this index. Each grade
   * holds a list of topics (no more day/week structure) - to publish a
   * new topic, add an entry to that grade's `topics` array with an href
   * for each of the six sections. Omit a section's href to show it as
   * "Coming soon" instead of a link.
   */
  const SECTIONS = [
    { key: "vocab",    cls: "vocab",    label: "Vocabulary &amp; Literacy" },
    { key: "explain",  cls: "explain",  label: "Explanation" },
    { key: "practice", cls: "practice", label: "Practice Set" },
    { key: "word",     cls: "word",     label: "Word Problems" },
    { key: "test",     cls: "test",     label: "Test Prep" },
    { key: "teacher",  cls: "teacher",  label: "Teacher's Guide" }
  ];

  const CURRICULUM = {
    Sixth: {
      label: "Sixth Grade",
      subject: "Math 6",
      topics: [
        {
          title: "Decimal Operations",
          summary: "Add, subtract, and multiply decimals with the standard algorithms, then apply them to multi-step and real-world word problems.",
          base: "Sixth/Decimal-Operations/",
          vocab: "Vocabulary-Literacy.html",
          explain: "Explanation.html",
          practice: "Practice-Set.html",
          word: "Word-Problems.html",
          test: "Test-Prep.html",
          teacher: "Teacher-Guide.html"
        }
      ]
    },
    Seventh: {
      label: "Seventh Grade",
      subject: "Pre-Algebra",
      topics: [
        {
          title: "Integers: Opposites &amp; Operations",
          summary: "Relate integers and their opposites, then add, subtract, multiply, and divide integers with confidence.",
          base: "Seventh/Integers/",
          vocab: "Vocabulary-Literacy.html",
          explain: "Explanation.html",
          practice: "Practice-Set.html",
          word: "Word-Problems.html",
          test: "Test-Prep.html",
          teacher: "Teacher-Guide.html"
        }
      ]
    },
    Eighth: {
      label: "Eighth Grade",
      subject: "Algebra I",
      topics: [
        {
          title: "Solving Linear Equations",
          summary: "Solve equations with variables on one and both sides, and classify solutions as one, none, or infinitely many.",
          base: "Eighth/Linear-Equations/",
          vocab: "Vocabulary-Literacy.html",
          explain: "Explanation.html",
          practice: "Practice-Set.html",
          word: "Word-Problems.html",
          test: "Test-Prep.html",
          teacher: "Teacher-Guide.html"
        }
      ]
    }
  };

  const GRADE_ORDER = ["Sixth", "Seventh", "Eighth"];

  function renderSectionLink(section, topic) {
    const href = topic[section.key];
    if (!href) {
      return `<span class="empty-tag">${section.label}<br>Coming soon</span>`;
    }
    return `
      <a class="section-link ${section.cls}" href="${topic.base}${href}">
        <span>${section.label}</span>
      </a>`;
  }

  function renderTopicCard(topic) {
    const sectionLinks = SECTIONS.map((s) => renderSectionLink(s, topic)).join("");
    return `
      <div class="topic-card">
        <div class="topic-card-head">
          <h3>${topic.title}</h3>
          <p>${topic.summary || ""}</p>
        </div>
        <div class="topic-card-body">
          <div class="section-grid">${sectionLinks}</div>
        </div>
      </div>`;
  }

  function renderGradePanel(gradeKey, isFirst) {
    const grade = CURRICULUM[gradeKey];
    const topics = grade.topics || [];
    const body = topics.length === 0
      ? `<p class="coming-soon">No topics published yet for ${grade.label} - check back soon.</p>`
      : `<div class="topic-grid">${topics.map(renderTopicCard).join("")}</div>`;
    return `
      <div class="grade-panel${isFirst ? " active" : ""}" id="panel-${gradeKey}">
        <div class="grade-intro">
          <h2>${grade.label}</h2>
          <p>${grade.subject}</p>
        </div>
        ${body}
      </div>`;
  }

  function renderGradePill(gradeKey, isFirst) {
    const grade = CURRICULUM[gradeKey];
    return `
      <button type="button" class="grade-pill${isFirst ? " active" : ""}" data-grade="${gradeKey}">
        ${grade.label}
        <span class="pill-subject">${grade.subject}</span>
      </button>`;
  }

  function showGrade(gradeKey) {
    document.querySelectorAll(".grade-panel").forEach((el) => {
      el.classList.toggle("active", el.id === `panel-${gradeKey}`);
    });
    document.querySelectorAll(".grade-pill").forEach((el) => {
      el.classList.toggle("active", el.dataset.grade === gradeKey);
    });
  }

  document.getElementById("grade-picker").innerHTML =
    GRADE_ORDER.map((g, i) => renderGradePill(g, i === 0)).join("");
  document.getElementById("grade-panels").innerHTML =
    GRADE_ORDER.map((g, i) => renderGradePanel(g, i === 0)).join("");

  document.querySelectorAll(".grade-pill").forEach((btn) => {
    btn.addEventListener("click", () => showGrade(btn.dataset.grade));
  });
</script>

</body>
</html>
