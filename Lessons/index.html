<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lesson Plans Index</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #1e3a8a;
      --primary-light: #2563eb;
      --accent: #d97706;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --border: #94a3b8;
      --success: #15803d;
      --success-bg: #dcfce7;
      --guide: #7c2d12;
      --guide-bg: #fff7ed;
      --empty: #64748b;
      --empty-bg: #f1f5f9;
    }
    * { box-sizing: border-box; }
    body, input, button {
      font-family: 'Montserrat', sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      font-size: 18px;
      line-height: 1.6;
    }
    .app-container {
      max-width: 1200px;
      margin: 0 auto;
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.12);
      border: 4px solid var(--primary);
      overflow: hidden;
    }
    header {
      background: var(--primary);
      color: white;
      padding: 28px 32px;
      text-align: center;
    }
    .badge {
      display: inline-block;
      background: #f59e0b;
      color: #000;
      padding: 6px 18px;
      border-radius: 30px;
      font-size: 0.95rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    h1 { margin: 8px 0; font-size: 2.2rem; font-weight: 800; }
    p.subtitle { margin: 4px 0 0 0; font-size: 1.05rem; opacity: 0.95; }

    .content { padding: 28px 32px 36px 32px; }

    /* ===== Grade (class) section ===== */
    .grade-section {
      margin-bottom: 30px;
      border: 2px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }
    .grade-header {
      background: var(--primary-light);
      color: white;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .grade-header h2 { margin: 0; font-size: 1.5rem; font-weight: 800; }
    .grade-header span.subject-tag {
      background: rgba(255,255,255,0.18);
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .grade-body { padding: 16px 20px; }

    /* ===== Quarter accordion ===== */
    details.quarter-block {
      border: 2px solid var(--primary-light);
      border-radius: 12px;
      margin-bottom: 14px;
      overflow: hidden;
    }
    details.quarter-block:last-child { margin-bottom: 0; }
    summary.quarter-summary {
      list-style: none;
      cursor: pointer;
      background: #dbeafe;
      color: var(--primary);
      padding: 12px 18px;
      font-weight: 800;
      font-size: 1.05rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    summary.quarter-summary::-webkit-details-marker { display: none; }
    summary.quarter-summary::marker { content: ""; }
    summary.quarter-summary .chevron {
      transition: transform 0.15s ease;
      font-size: 0.85rem;
    }
    details[open] > summary.quarter-summary .chevron { transform: rotate(90deg); }
    summary.quarter-summary .week-count {
      font-weight: 700;
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: #1d4ed8;
      opacity: 0.8;
    }
    .quarter-body { padding: 14px 16px 16px 16px; }
    .quarter-empty {
      color: var(--empty);
      font-style: italic;
      font-size: 0.95rem;
      padding: 4px 4px 8px 4px;
    }

    /* ===== Week accordion ===== */
    details.week-block {
      border: 2px solid var(--border);
      border-radius: 10px;
      margin-bottom: 12px;
      background: var(--bg);
      overflow: hidden;
    }
    details.week-block:last-child { margin-bottom: 0; }
    summary.week-summary {
      list-style: none;
      cursor: pointer;
      padding: 10px 16px;
      display: flex;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap;
      background: var(--card);
    }
    summary.week-summary::-webkit-details-marker { display: none; }
    summary.week-summary::marker { content: ""; }
    summary.week-summary .chevron {
      transition: transform 0.15s ease;
      font-size: 0.8rem;
      color: var(--primary);
    }
    details[open] > summary.week-summary .chevron { transform: rotate(90deg); }
    summary.week-summary .week-code {
      background: var(--accent);
      color: #000;
      padding: 3px 12px;
      border-radius: 16px;
      font-weight: 800;
      font-size: 0.8rem;
      text-transform: uppercase;
    }
    summary.week-summary .week-title { font-weight: 800; color: var(--primary); font-size: 1.05rem; }
    .week-body { padding: 14px 16px 16px 16px; }
    p.week-sub { margin: 0 0 14px 0; color: #475569; font-size: 0.92rem; }

    /* ===== Day / guide button grid (6 buttons: Mon-Fri + Guide) ===== */
    .item-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
    }
    .day-btn, .guide-btn, .empty-tag {
      display: block;
      text-decoration: none;
      border-radius: 10px;
      padding: 12px 12px;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    .day-btn { background: var(--success-bg); border: 2px solid var(--success); color: var(--text); }
    .guide-btn { background: var(--guide-bg); border: 2px solid var(--guide); color: var(--guide); }
    .day-btn:hover, .guide-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 14px rgba(0,0,0,0.12); }

    .item-label {
      display: block;
      font-weight: 800;
      text-transform: uppercase;
      font-size: 0.76rem;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .day-btn .item-label { color: var(--success); }
    .guide-btn .item-label { color: var(--guide); }
    .item-topic {
      display: block;
      font-size: 0.88rem;
      font-weight: 600;
      line-height: 1.3;
    }

    /* Tag shown for a day/guide slot with no content yet */
    .empty-tag {
      background: var(--empty-bg);
      border: 2px dashed var(--border);
      color: var(--empty);
      cursor: default;
    }
    .empty-tag .item-label { color: var(--empty); }
    .empty-tag .item-topic { font-style: italic; }

    .coming-soon {
      color: var(--empty);
      font-style: italic;
      font-size: 0.95rem;
      padding: 16px 20px;
    }

    footer {
      text-align: center;
      padding: 18px;
      color: #94a3b8;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

<div class="app-container">
  <header>
    <span class="badge">Lincoln International Academy</span>
    <h1>Lesson Plans</h1>
    <p class="subtitle">Digital lessons, guided practice, and teacher guides - organized by grade, quarter, and week</p>
  </header>

  <div class="content" id="content"></div>

  <footer>Lincoln International Academy &middot; Lesson Plans Index</footer>
</div>

<script>
  /*
   * CURRICULUM is the single source of truth for this index.
   * To publish a new week: add one entry under the right grade/quarter's
   * `weeks` object. To add a day within a week that isn't built yet,
   * either omit it from `days` (it will show as a "No content yet" tag)
   * or leave the whole `guide` key out to tag the Teacher Guide as empty.
   * Quarters 1-4 always render for every grade, even with zero weeks,
   * so the full-year structure is visible as soon as classes are created.
   */
  const QUARTERS = [1, 2, 3, 4];
  const DAY_ORDER = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"];

  const CURRICULUM = {
    Sixth: {
      label: "Sixth Grade",
      subject: "Math 6",
      quarters: {
        1: {
          weeks: {
            "Q01W02": {
              title: "Decimal Operations",
              summary: "Add, subtract, and multiply decimals; multi-step word problems; error analysis; real-world jigsaw; graded classwork.",
              days: {
                Monday:    { topic: "Add, Subtract &amp; Multiply Decimals", href: "Sixth/Q01W02/Monday.html" },
                Tuesday:   { topic: "Multi-Step Word Problems", href: "Sixth/Q01W02/Tuesday.html" },
                Wednesday: { topic: "Error Analysis &amp; Health Science", href: "Sixth/Q01W02/Wednesday.html" },
                Thursday:  { topic: "Real-World Decimal Jigsaw", href: "Sixth/Q01W02/Thursday.html" },
                Friday:    { topic: "Graded Classwork", href: "Sixth/Q01W02/Friday.html" }
              },
              guide: { href: "Sixth/Q01W02/Teacher-Guide.html" }
            }
          }
        }
      }
    },
    Seventh: {
      label: "Seventh Grade",
      subject: "Math 7",
      quarters: {
        1: {
          weeks: {
            "Q01W01": {
              title: "Week 1",
              summary: "Not yet built - shown so the week is visible in the year plan as soon as pages are added.",
              days: {},
              guide: null
            }
          }
        }
      }
    },
    Eighth: {
      label: "Eighth Grade",
      subject: "Algebra I",
      quarters: {
        1: {
          weeks: {
            "Q01W02": {
              title: "Solving Linear Equations",
              summary: "Lessons 1-2 &amp; 1-3: variables on one and both sides, classifying solutions, real-world applications, graded classwork.",
              days: {
                Monday:    { topic: "Solving Linear Equations", href: "Eighth/Q01W02/Monday.html" },
                Tuesday:   { topic: "Practice: Solving Linear Equations", href: "Eighth/Q01W02/Tuesday.html" },
                Wednesday: { topic: "One, None, or Infinitely Many Solutions?", href: "Eighth/Q01W02/Wednesday.html" },
                Thursday:  { topic: "Review: Solving Linear Equations", href: "Eighth/Q01W02/Thursday.html" },
                Friday:    { topic: "Graded Classwork", href: "Eighth/Q01W02/Friday.html" }
              },
              guide: { href: "Eighth/Q01W02/Teacher-Guide.html" }
            }
          }
        }
      }
    }
  };

  const GRADE_ORDER = ["Sixth", "Seventh", "Eighth"];

  function pad2(n) { return String(n).padStart(2, "0"); }

  function renderDayOrGuide(kind, label, entry) {
    if (!entry) {
      return `
        <span class="empty-tag">
          <span class="item-label">${label}</span>
          <span class="item-topic">No content yet</span>
        </span>`;
    }
    const cls = kind === "guide" ? "guide-btn" : "day-btn";
    return `
      <a class="${cls}" href="${entry.href}">
        <span class="item-label">${label}</span>
        <span class="item-topic">${entry.topic || "Teacher Guide"}</span>
      </a>`;
  }

  function renderWeek(weekCode, week) {
    const dayButtons = DAY_ORDER.map((day) => renderDayOrGuide("day", day, week.days[day])).join("");
    const guideButton = renderDayOrGuide("guide", "Teacher Guide", week.guide);
    return `
      <details class="week-block" open>
        <summary class="week-summary">
          <span class="chevron">&#9656;</span>
          <span class="week-code">${weekCode}</span>
          <span class="week-title">${week.title}</span>
        </summary>
        <div class="week-body">
          <p class="week-sub">${week.summary || ""}</p>
          <div class="item-row">
            ${dayButtons}
            ${guideButton}
          </div>
        </div>
      </details>`;
  }

  function renderQuarter(qNum, quarterData) {
    const weeks = (quarterData && quarterData.weeks) ? quarterData.weeks : {};
    const weekCodes = Object.keys(weeks).sort();
    const count = weekCodes.length;
    const body = count === 0
      ? `<p class="quarter-empty">No weeks published yet.</p>`
      : weekCodes.map((code) => renderWeek(code, weeks[code])).join("");
    return `
      <details class="quarter-block" ${count > 0 ? "open" : ""}>
        <summary class="quarter-summary">
          <span style="display:flex; align-items:center; gap:10px;">
            <span class="chevron">&#9656;</span>
            Quarter ${pad2(qNum)}
          </span>
          <span class="week-count">${count} week${count === 1 ? "" : "s"} published</span>
        </summary>
        <div class="quarter-body">${body}</div>
      </details>`;
  }

  function renderGrade(gradeKey) {
    const grade = CURRICULUM[gradeKey];
    const quarterHtml = QUARTERS.map((q) => renderQuarter(q, grade.quarters[q])).join("");
    return `
      <div class="grade-section">
        <div class="grade-header">
          <h2>${grade.label}</h2>
          <span class="subject-tag">${grade.subject}</span>
        </div>
        <div class="grade-body">${quarterHtml}</div>
      </div>`;
  }

  document.getElementById("content").innerHTML = GRADE_ORDER.map(renderGrade).join("");
</script>

</body>
</html>
